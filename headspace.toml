# Headspace Manager configuration
#
# root          Jellyfin library root (Category/Artist/Album/...)
# cache         download staging area
# language      de or en
# narrator      preferred narrator, empty string disables the filter
# durations     preferred session lengths in minutes
# sleepcasts_all  download all current Sleepcasts as MIXED tracks

root = "~/Musik/Headspace"
cache = "Saved/Audio"
language = "de"
narrator = "Suzanne"
durations = [10, 15, 20]
sleepcasts_all = true

